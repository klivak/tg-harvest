[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-parser"
version = "0.2.0"
description = "Telegram channel/chat parser via MTProto API"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.42",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "click>=8.1",
    "rich>=13.0",
    "aiofiles>=23.0",
    "cryptg>=0.4",
    "python-dotenv>=1.0",
    "streamlit>=1.40",
    "plotly>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "pre-commit>=3.0",
]

[project.scripts]
tg-parser = "tg_parser.cli.app:cli"
tg-parser-web = "tg_parser.web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
